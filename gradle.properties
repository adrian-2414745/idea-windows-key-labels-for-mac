# IDE used to compile, test and run (`./gradlew runIde`).
# Set platformLocalPath to an installed IDE to skip the download, e.g. in ~/.gradle/gradle.properties:
# platformLocalPath=/Users/<you>/Applications/IntelliJ IDEA.app
platformVersion = 2026.2.1

# Use the Kotlin stdlib bundled with the IDE -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
